<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東南西北大冒險 - 指南針方向練習</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "PingFang HK", "Heiti TC", sans-serif;
        }
        body {
            margin: 0;
            padding: 16px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 24px;
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 12px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b6b;
        }
        .score {
            font-size: 20px;
            font-weight: bold;
            color: #2a9d8f;
        }
        .instruction {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            padding: 10px 20px;
            font-size: 19px;
            color: #333;
            text-align: center;
            max-width: 720px;
            margin: 0 0 8px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        .instruction .dir-tag {
            display: inline-block;
            min-width: 1.6em;
            padding: 0 0.35em;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
        }
        .compass {
            position: relative;
            width: min(92vw, 400px);
            height: min(92vw, 400px);
            margin: 4px 0;
        }
        .dial {
            position: absolute;
            inset: 13%;
            border-radius: 50%;
            background: #ffffff;
            border: 6px solid #ffb703;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), inset 0 0 0 4px #fff3d6;
        }
        .dial svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        #needle {
            transition: transform 0.6s ease;
            transform-origin: 50px 50px;
        }
        .zone {
            position: absolute;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 3px dashed #94a3b8;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            color: #b6c2cf;
            transform: translate(-50%, -50%);
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .zone[data-pos="0"] { top: 8%;  left: 50%; }
        .zone[data-pos="1"] { top: 50%; left: 92%; }
        .zone[data-pos="2"] { top: 92%; left: 50%; }
        .zone[data-pos="3"] { top: 50%; left: 8%; }
        .zone.armed {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 5px rgba(255, 107, 107, 0.2);
        }
        .zone.correct {
            border-style: solid;
            border-color: #2a9d8f;
            background: #e6f6f4;
        }
        .zone.wrong-flash {
            border-color: #e63946;
            background: #ffe5e8;
        }
        .zone.given-zone {
            border-style: solid;
            border-color: #ffb703;
            background: #fff8e6;
        }
        .zone:focus-visible, .chip:focus-visible, .next-btn:focus-visible {
            outline: 3px solid #1d4ed8;
            outline-offset: 2px;
        }
        .tray {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            align-items: center;
            min-height: 90px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 20px;
            margin-top: 4px;
        }
        .chip {
            border-radius: 999px;
            padding: 10px 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 30px;
            font-weight: bold;
            color: #fff;
            cursor: grab;
            touch-action: none;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
            transition: transform 0.25s ease, box-shadow 0.2s;
            position: relative;
            z-index: 1;
        }
        .chip .icon {
            font-size: 28px;
            line-height: 1;
        }
        .chip.dragging {
            cursor: grabbing;
            transition: none;
            z-index: 50;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }
        .chip.selected {
            box-shadow: 0 0 0 5px rgba(255, 183, 3, 0.65), 0 5px 12px rgba(0, 0, 0, 0.2);
        }
        .chip.locked {
            cursor: default;
            box-shadow: none;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 0;
            gap: 0;
            font-size: 30px;
        }
        .chip.locked .icon {
            display: none;
        }
        .chip.shake {
            animation: shake 0.4s ease;
        }
        .given-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            line-height: 1.05;
        }
        .given-chip .gicon {
            font-size: 20px;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .msg {
            min-height: 34px;
            font-size: 20px;
            font-weight: bold;
            color: #e63946;
            margin-top: 6px;
            text-align: center;
        }
        .msg.good { color: #2a9d8f; }
        .tip {
            font-size: 15px;
            color: #6b7280;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 14px;
            border-radius: 12px;
            margin-top: 4px;
            text-align: center;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 41, 59, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .overlay.show { display: flex; }
        .win-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 40px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
            animation: pop 0.3s ease;
        }
        @keyframes pop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .win-card .big {
            font-size: 52px;
        }
        .win-card .text {
            font-size: 26px;
            font-weight: bold;
            color: #ff6b6b;
            margin: 10px 0 20px;
        }
        .next-btn {
            background: #4ecdc4;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 14px 36px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #38b2a8;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .next-btn:hover { background: #45b8b0; }
        .next-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #38b2a8;
        }
        .confetti {
            position: fixed;
            top: -30px;
            font-size: 26px;
            pointer-events: none;
            z-index: 101;
            animation: fall 2.6s linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            #needle { transition: none; }
            .chip.shake { animation: none; }
            .win-card { animation: none; }
            .confetti { display: none; }
        }
        @media (max-width: 420px) {
            .title { font-size: 20px; }
            .score { font-size: 17px; }
            .instruction { font-size: 16px; }
            .zone { width: 64px; height: 64px; font-size: 26px; }
            .chip { padding: 8px 16px; font-size: 26px; }
            .chip .icon { font-size: 24px; }
            .chip.locked { font-size: 26px; }
            .given-chip { font-size: 26px; }
            .given-chip .gicon { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🧭 東南西北大冒險</div>
        <div class="score">⭐ 答對：<span id="score">0</span> 題</div>
    </div>

    <p class="instruction" id="instruction"></p>

    <div class="compass" id="compass">
        <div class="dial">
            <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="46" fill="none" stroke="#ffe3a3" stroke-width="1.5"/>
                <g id="ticks" stroke="#c9a227" stroke-width="1.2"></g>
                <g id="needle">
                    <polygon points="50,14 45.5,50 54.5,50" fill="#e63946"/>
                    <polygon points="50,86 45.5,50 54.5,50" fill="#94a3b8"/>
                    <circle cx="50" cy="50" r="4" fill="#ffb703" stroke="#fff" stroke-width="1.5"/>
                </g>
            </svg>
        </div>
        <div class="zone" data-pos="0" data-filled="0" tabindex="0" role="button" aria-label="上方位置">?</div>
        <div class="zone" data-pos="1" data-filled="0" tabindex="0" role="button" aria-label="右方位置">?</div>
        <div class="zone" data-pos="2" data-filled="0" tabindex="0" role="button" aria-label="下方位置">?</div>
        <div class="zone" data-pos="3" data-filled="0" tabindex="0" role="button" aria-label="左方位置">?</div>
    </div>

    <div class="tray" id="tray"></div>

    <div class="msg" id="msg"></div>
    <div class="tip">小提示：記住身體指南針——👦頭係北、🦶腳係南、👍手指公係西、✍️寫字嗰隻手係東。北同南相對，東同西相對。指南針嘅紅色針指向就係題目話你知嘅方向！</div>

    <div class="overlay" id="overlay">
        <div class="win-card">
            <div class="big">🎉🌟🎉</div>
            <div class="text">好叻呀！全部啱晒！</div>
            <button class="next-btn" id="nextBtn">下一題 ➜</button>
        </div>
    </div>

    <script>
        var DIRS = ['北', '東', '南', '西'];           // 順時針
        var COLORS = { '北': '#e63946', '東': '#2a9d8f', '南': '#f4a261', '西': '#457b9d' };
        var ICONS = { '北': '👦', '南': '🦶', '西': '👍', '東': '✍️' };  // 身體指南針：頭=北、腳=南、手指公=西、寫字手=東
        var PRAISE = ['啱啦！好嘢！👍', '答啱咗！叻仔仔叻女！🌟', '冇錯！繼續加油！💪'];
        var WRONG = ['唔啱喎，再諗下！🤔', '差少少咋，再試下！', '諗清楚先，你可以嘅！'];

        // 刻度
        (function () {
            var ticks = document.getElementById('ticks');
            var html = '';
            for (var i = 0; i < 12; i++) {
                var a = i * 30 * Math.PI / 180;
                var long = (i % 3 === 0);
                var r1 = long ? 40 : 43, r2 = 46;
                html += '<line x1="' + (50 + r1 * Math.sin(a)) + '" y1="' + (50 - r1 * Math.cos(a)) +
                        '" x2="' + (50 + r2 * Math.sin(a)) + '" y2="' + (50 - r2 * Math.cos(a)) +
                        '" stroke-width="' + (long ? 2 : 1) + '"/>';
            }
            ticks.innerHTML = html;
        })();

        var zones = Array.prototype.slice.call(document.querySelectorAll('.zone'));
        var tray = document.getElementById('tray');
        var msg = document.getElementById('msg');
        var scoreEl = document.getElementById('score');
        var overlay = document.getElementById('overlay');
        var nextBtn = document.getElementById('nextBtn');
        var compass = document.getElementById('compass');

        var givenDir = 0, givenPos = 0, expected = ['', '', '', ''];
        var placed = 0, score = 0;
        var selectedChip = null;

        function rand(n) { return Math.floor(Math.random() * n); }

        function shuffle(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = rand(i + 1);
                var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
            }
            return arr;
        }

        function setMsg(text, good) {
            msg.textContent = text;
            msg.className = good ? 'msg good' : 'msg';
        }

        function makeChip(dir) {
            var chip = document.createElement('div');
            chip.className = 'chip';
            chip.dataset.dir = dir;
            chip.innerHTML = '<span class="icon">' + ICONS[dir] + '</span><span>' + dir + '</span>';
            chip.style.background = COLORS[dir];
            chip.setAttribute('tabindex', '0');
            chip.setAttribute('role', 'button');
            chip.setAttribute('aria-label', '方向牌：' + dir);
            attachDrag(chip);
            chip.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleSelect(chip);
                }
            });
            return chip;
        }

        function toggleSelect(chip) {
            if (chip.classList.contains('locked')) return;
            if (selectedChip === chip) {
                chip.classList.remove('selected');
                selectedChip = null;
            } else {
                if (selectedChip) selectedChip.classList.remove('selected');
                selectedChip = chip;
                chip.classList.add('selected');
            }
            updateArmed();
        }

        function updateArmed() {
            zones.forEach(function (z) {
                if (selectedChip && z.dataset.filled === '0') z.classList.add('armed');
                else z.classList.remove('armed');
            });
        }

        function attachDrag(chip) {
            var startX = 0, startY = 0, moved = false, dragging = false;

            chip.addEventListener('pointerdown', function (e) {
                if (chip.classList.contains('locked')) return;
                e.preventDefault();
                dragging = true;
                moved = false;
                startX = e.clientX;
                startY = e.clientY;
                chip.setPointerCapture(e.pointerId);
                chip.classList.add('dragging');
            });

            chip.addEventListener('pointermove', function (e) {
                if (!dragging) return;
                var dx = e.clientX - startX;
                var dy = e.clientY - startY;
                if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
                if (moved) chip.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
            });

            chip.addEventListener('pointerup', function (e) {
                if (!dragging) return;
                dragging = false;
                chip.classList.remove('dragging');
                if (!moved) {
                    chip.style.transform = '';
                    toggleSelect(chip);
                    return;
                }
                var zone = zoneAt(e.clientX, e.clientY);
                if (zone) {
                    attemptDrop(chip, zone);
                } else {
                    snapBack(chip);
                }
            });

            chip.addEventListener('pointercancel', function () {
                dragging = false;
                chip.classList.remove('dragging');
                snapBack(chip);
            });
        }

        function zoneAt(x, y) {
            for (var i = 0; i < zones.length; i++) {
                var r = zones[i].getBoundingClientRect();
                var pad = 10;
                if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) {
                    return zones[i];
                }
            }
            return null;
        }

        function snapBack(chip) {
            chip.style.transform = '';
        }

        function attemptDrop(chip, zone) {
            var pos = parseInt(zone.dataset.pos, 10);
            if (zone.dataset.filled === '1') {
                snapBack(chip);
                setMsg('呢個位已經有方向喇！揀個空位啦！', false);
                return;
            }
            if (chip.dataset.dir === expected[pos]) {
                zone.appendChild(chip);
                zone.dataset.filled = '1';
                zone.classList.add('correct');
                zone.textContent = '';
                zone.appendChild(chip);
                chip.style.transform = '';
                chip.classList.add('locked');
                chip.classList.remove('selected');
                if (selectedChip === chip) selectedChip = null;
                chip.setAttribute('aria-label', '已放好：' + chip.dataset.dir);
                placed++;
                setMsg(PRAISE[rand(PRAISE.length)], true);
                updateArmed();
                if (placed === 3) win();
            } else {
                zone.classList.add('wrong-flash');
                setTimeout(function () { zone.classList.remove('wrong-flash'); }, 450);
                chip.classList.add('shake');
                setTimeout(function () { chip.classList.remove('shake'); }, 450);
                snapBack(chip);
                setMsg(WRONG[rand(WRONG.length)], false);
            }
        }

        zones.forEach(function (zone) {
            zone.addEventListener('click', function () {
                if (selectedChip) attemptDrop(selectedChip, zone);
            });
            zone.addEventListener('keydown', function (e) {
                if ((e.key === 'Enter' || e.key === ' ') && selectedChip) {
                    e.preventDefault();
                    attemptDrop(selectedChip, zone);
                }
            });
        });

        function win() {
            score++;
            scoreEl.textContent = score;
            setTimeout(function () {
                overlay.classList.add('show');
                nextBtn.focus();
                spawnConfetti();
            }, 500);
        }

        function spawnConfetti() {
            var icons = ['🎉', '⭐', '🌟', '🎊', '✨'];
            for (var i = 0; i < 16; i++) {
                var c = document.createElement('div');
                c.className = 'confetti';
                c.textContent = icons[rand(icons.length)];
                c.style.left = rand(100) + 'vw';
                c.style.animationDelay = (Math.random() * 0.8) + 's';
                document.body.appendChild(c);
                (function (el) {
                    setTimeout(function () { el.remove(); }, 3600);
                })(c);
            }
        }

        function newRound() {
            // 隨機：邊個方向做提示 + 提示放喺邊個位置（所以「北」唔一定向上）
            givenDir = rand(4);
            givenPos = rand(4);
            for (var p = 0; p < 4; p++) {
                expected[p] = DIRS[(givenDir + p - givenPos + 4) % 4];
            }
            compass.dataset.givenDir = DIRS[givenDir];
            compass.dataset.givenPos = givenPos;

            placed = 0;
            selectedChip = null;
            setMsg('', false);

            // 指南針針轉向提示方向（0=上 90=右 180=下 270=左）
            document.getElementById('needle').style.transform = 'rotate(' + (givenPos * 90) + 'deg)';

            // 重設四個位置
            zones.forEach(function (z) {
                z.dataset.filled = '0';
                z.classList.remove('correct', 'given-zone', 'armed');
                z.innerHTML = '?';
            });

            // 放提示方向
            var gz = zones[givenPos];
            gz.dataset.filled = '1';
            gz.classList.add('given-zone');
            gz.innerHTML = '';
            var g = document.createElement('div');
            g.className = 'given-chip';
            g.style.background = COLORS[DIRS[givenDir]];
            g.innerHTML = '<span class="gicon">' + ICONS[DIRS[givenDir]] + '</span>' + DIRS[givenDir];
            gz.appendChild(g);

            // 指示文字
            document.getElementById('instruction').innerHTML =
                '指南針話你知 <span class="dir-tag" style="background:' + COLORS[DIRS[givenDir]] + '">' +
                ICONS[DIRS[givenDir]] + ' ' + DIRS[givenDir] + '</span> 喺邊，將其餘三個方向拖去正確位置！';

            // 三塊方向牌（隨機次序）
            tray.innerHTML = '';
            var rest = DIRS.filter(function (d, i) { return i !== givenDir; });
            shuffle(rest).forEach(function (d) {
                tray.appendChild(makeChip(d));
            });
        }

        nextBtn.addEventListener('click', function () {
            overlay.classList.remove('show');
            newRound();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && overlay.classList.contains('show')) {
                overlay.classList.remove('show');
                newRound();
            }
        });

        newRound();
    </script>
</body>
</html>
